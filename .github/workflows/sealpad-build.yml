name: Sealpad Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:

  # ── macOS Apple Silicon ───────────────────────────────────────────────────
  build-macos-arm64:
    name: macOS arm64
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: Python setuptools
        run: python3 -m pip install --break-system-packages setuptools

      - name: Install root deps
        env:
          npm_config_arch: arm64
          GYP_DEFINES: kerberos_use_rtld=false
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npm ci

      - name: Build sealpad extension
        working-directory: extensions/sealpad
        env:
          NODE_ENV: production
        run: npm install && npm run compile

      - name: Compile core
        run: npm run compile

      - name: Package
        env:
          npm_config_arch: arm64
          GYP_DEFINES: kerberos_use_rtld=false
          VSCODE_ARCH: arm64
        run: node_modules/.bin/gulp vscode-darwin-arm64 --max-old-space-size=8192

      - name: Create DMG
        run: |
          hdiutil create -volname "Sealpad" \
            -srcfolder "../VSCode-darwin-arm64/Sealpad.app" \
            -ov -format UDZO \
            sealpad-darwin-arm64.dmg

      - uses: actions/upload-artifact@v4
        with:
          name: sealpad-darwin-arm64
          path: sealpad-darwin-arm64.dmg
          retention-days: 14

  # ── Linux x64 ────────────────────────────────────────────────────────────
  build-linux-x64:
    name: Linux x64
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: System deps
        run: |
          sudo apt-get update -y
          sudo apt-get install -y \
            build-essential libx11-dev libxkbfile-dev \
            libsecret-1-dev libkrb5-dev python3-setuptools

      - name: Install root deps
        env:
          npm_config_arch: x64
          CFLAGS: -Wno-cast-function-type
          CXXFLAGS: -Wno-cast-function-type -std=c++20
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npm ci

      - name: Build sealpad extension
        working-directory: extensions/sealpad
        env:
          NODE_ENV: production
        run: npm install && npm run compile

      - name: Compile core
        run: npm run compile

      - name: Package
        env:
          VSCODE_ARCH: x64
        run: node_modules/.bin/gulp vscode-linux-x64 --max-old-space-size=8192

      - name: Archive
        run: tar -czf sealpad-linux-x64.tar.gz -C ../VSCode-linux-x64 .

      - uses: actions/upload-artifact@v4
        with:
          name: sealpad-linux-x64
          path: sealpad-linux-x64.tar.gz
          retention-days: 14

  # ── Windows x64 ──────────────────────────────────────────────────────────
  build-windows-x64:
    name: Windows x64
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: Python setuptools
        run: pip install setuptools

      - name: Install root deps
        env:
          npm_config_arch: x64
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npm ci

      - name: Build sealpad extension
        working-directory: extensions/sealpad
        env:
          NODE_ENV: production
        run: npm install && npm run compile

      - name: Compile core
        run: npm run compile

      - name: Package
        env:
          VSCODE_ARCH: x64
        run: node_modules/.bin/gulp vscode-win32-x64 --max-old-space-size=8192

      - name: Archive
        shell: pwsh
        run: Compress-Archive -Path "..\VSCode-win32-x64\*" -DestinationPath sealpad-win32-x64.zip

      - uses: actions/upload-artifact@v4
        with:
          name: sealpad-win32-x64
          path: sealpad-win32-x64.zip
          retention-days: 14

  # ── Release (main only, all required jobs must pass) ──────────────────────
  release:
    name: Release
    needs: [build-macos-arm64, build-linux-x64, build-windows-x64]
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: release-assets/

      - name: Tag
        id: tag
        run: |
          VERSION=$(node -p "require('./package.json').version")
          SHORT="${GITHUB_SHA::7}"
          echo "tag=v${VERSION}-${SHORT}" >> $GITHUB_OUTPUT
          echo "name=Sealpad v${VERSION} (${SHORT})" >> $GITHUB_OUTPUT

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          name: ${{ steps.tag.outputs.name }}
          draft: false
          prerelease: true
          generate_release_notes: false
          body: |
            Automated build from `main`.

            | Platform | Download |
            |---|---|
            | macOS Apple Silicon | `sealpad-darwin-arm64.dmg` |
            | Linux x64 | `sealpad-linux-x64.tar.gz` |
            | Windows x64 | `sealpad-win32-x64.zip` |

            > Unsigned builds. macOS: right-click → Open to bypass Gatekeeper.
          files: |
            release-assets/sealpad-darwin-arm64/*.dmg
            release-assets/sealpad-linux-x64/*.tar.gz
            release-assets/sealpad-win32-x64/*.zip
