name: Sealpad Build & Release

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  SEALPAD_SUPABASE_URL: ${{ secrets.SEALPAD_SUPABASE_URL }}
  SEALPAD_SUPABASE_ANON_KEY: ${{ secrets.SEALPAD_SUPABASE_ANON_KEY }}

jobs:
  # ──────────────────────────────────────────────
  # macOS arm64 (M1/M2/M3)
  # ──────────────────────────────────────────────
  build-macos-arm64:
    name: macOS arm64
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: false

      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: Python setuptools (node-gyp)
        run: python3 -m pip install --break-system-packages setuptools

      - name: Install root dependencies
        env:
          npm_config_arch: arm64
          GYP_DEFINES: kerberos_use_rtld=false
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npm ci

      - name: Install & compile sealpad extension
        working-directory: extensions/sealpad
        env:
          NODE_ENV: production
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npm ci && npm run compile

      - name: Compile core + all extensions
        run: npm run compile

      - name: Package macOS arm64
        env:
          npm_config_arch: arm64
          GYP_DEFINES: kerberos_use_rtld=false
          VSCODE_ARCH: arm64
        run: node_modules/.bin/gulp vscode-darwin-arm64 --max-old-space-size=8192

      - name: Create DMG
        run: |
          hdiutil create -volname "Sealpad" \
            -srcfolder "../VSCode-darwin-arm64/Sealpad.app" \
            -ov -format UDZO \
            "sealpad-darwin-arm64.dmg"

      - uses: actions/upload-artifact@v4
        with:
          name: sealpad-darwin-arm64
          path: sealpad-darwin-arm64.dmg
          retention-days: 14

  # ──────────────────────────────────────────────
  # macOS x64 (Intel)
  # ──────────────────────────────────────────────
  build-macos-x64:
    name: macOS x64
    runs-on: macos-13
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: false

      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: Python setuptools (node-gyp)
        run: python3 -m pip install --break-system-packages setuptools

      - name: Install root dependencies
        env:
          npm_config_arch: x64
          GYP_DEFINES: kerberos_use_rtld=false
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npm ci

      - name: Install & compile sealpad extension
        working-directory: extensions/sealpad
        env:
          NODE_ENV: production
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npm ci && npm run compile

      - name: Compile core + all extensions
        run: npm run compile

      - name: Package macOS x64
        env:
          npm_config_arch: x64
          GYP_DEFINES: kerberos_use_rtld=false
          VSCODE_ARCH: x64
        run: node_modules/.bin/gulp vscode-darwin-x64 --max-old-space-size=8192

      - name: Create DMG
        run: |
          hdiutil create -volname "Sealpad" \
            -srcfolder "../VSCode-darwin-x64/Sealpad.app" \
            -ov -format UDZO \
            "sealpad-darwin-x64.dmg"

      - uses: actions/upload-artifact@v4
        with:
          name: sealpad-darwin-x64
          path: sealpad-darwin-x64.dmg
          retention-days: 14

  # ──────────────────────────────────────────────
  # Linux x64
  # ──────────────────────────────────────────────
  build-linux-x64:
    name: Linux x64
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: false

      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: System dependencies
        run: |
          sudo apt-get update -y
          sudo apt-get install -y \
            build-essential libx11-dev libxkbfile-dev \
            libsecret-1-dev libkrb5-dev python3-setuptools \
            fakeroot rpm dpkg-dev gcc-12 g++-12

      - name: Install root dependencies
        env:
          npm_config_arch: x64
          CC: gcc-12
          CXX: g++-12
          CFLAGS: -Wno-cast-function-type
          CXXFLAGS: -Wno-cast-function-type -std=c++20
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npm ci

      - name: Install & compile sealpad extension
        working-directory: extensions/sealpad
        env:
          NODE_ENV: production
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npm ci && npm run compile

      - name: Compile core + all extensions
        run: npm run compile

      - name: Package Linux x64 tarball
        env:
          VSCODE_ARCH: x64
        run: node_modules/.bin/gulp vscode-linux-x64 --max-old-space-size=8192

      - name: Build .deb
        env:
          VSCODE_ARCH: x64
        run: |
          node_modules/.bin/gulp vscode-linux-x64-prepare-deb --max-old-space-size=8192
          node_modules/.bin/gulp vscode-linux-x64-build-deb --max-old-space-size=8192

      - name: Build .rpm
        env:
          VSCODE_ARCH: x64
        run: |
          node_modules/.bin/gulp vscode-linux-x64-prepare-rpm --max-old-space-size=8192
          node_modules/.bin/gulp vscode-linux-x64-build-rpm --max-old-space-size=8192

      - name: Collect artifacts
        run: |
          mkdir -p dist-linux-x64
          cp .build/linux/deb/amd64/deb/*.deb dist-linux-x64/ 2>/dev/null || true
          cp .build/linux/rpm/x86_64/rpmbuild/RPMS/x86_64/*.rpm dist-linux-x64/ 2>/dev/null || true
          tar -czf dist-linux-x64/sealpad-linux-x64.tar.gz \
            -C ../VSCode-linux-x64 . 2>/dev/null || true

      - uses: actions/upload-artifact@v4
        with:
          name: sealpad-linux-x64
          path: dist-linux-x64/
          retention-days: 14

  # ──────────────────────────────────────────────
  # Linux arm64 (cross-compiled on x64 host)
  # ──────────────────────────────────────────────
  build-linux-arm64:
    name: Linux arm64
    runs-on: ubuntu-22.04
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: false

      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: System dependencies
        run: |
          sudo apt-get update -y
          sudo apt-get install -y \
            build-essential libx11-dev libxkbfile-dev \
            libsecret-1-dev libkrb5-dev python3-setuptools \
            fakeroot dpkg-dev gcc-aarch64-linux-gnu \
            g++-aarch64-linux-gnu gcc-12 g++-12

      - name: Install root dependencies (arm64 cross)
        env:
          npm_config_arch: arm64
          CC: aarch64-linux-gnu-gcc
          CXX: aarch64-linux-gnu-g++
          CFLAGS: -Wno-cast-function-type
          CXXFLAGS: -Wno-cast-function-type -std=c++20
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npm ci

      - name: Install & compile sealpad extension
        working-directory: extensions/sealpad
        env:
          NODE_ENV: production
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npm ci && npm run compile

      - name: Compile core + all extensions
        run: npm run compile

      - name: Package Linux arm64
        env:
          VSCODE_ARCH: arm64
        run: node_modules/.bin/gulp vscode-linux-arm64 --max-old-space-size=8192

      - name: Build .deb (arm64)
        env:
          VSCODE_ARCH: arm64
        run: |
          node_modules/.bin/gulp vscode-linux-arm64-prepare-deb --max-old-space-size=8192
          node_modules/.bin/gulp vscode-linux-arm64-build-deb --max-old-space-size=8192

      - name: Collect artifacts
        run: |
          mkdir -p dist-linux-arm64
          cp .build/linux/deb/arm64/deb/*.deb dist-linux-arm64/ 2>/dev/null || true
          tar -czf dist-linux-arm64/sealpad-linux-arm64.tar.gz \
            -C ../VSCode-linux-arm64 . 2>/dev/null || true

      - uses: actions/upload-artifact@v4
        with:
          name: sealpad-linux-arm64
          path: dist-linux-arm64/
          retention-days: 14

  # ──────────────────────────────────────────────
  # Windows x64
  # ──────────────────────────────────────────────
  build-windows-x64:
    name: Windows x64
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: false

      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: Install Python setuptools
        run: pip install setuptools

      - name: Install root dependencies
        env:
          npm_config_arch: x64
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npm ci

      - name: Install & compile sealpad extension
        working-directory: extensions/sealpad
        env:
          NODE_ENV: production
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npm ci && npm run compile

      - name: Compile core + all extensions
        run: npm run compile

      - name: Package Windows x64
        env:
          VSCODE_ARCH: x64
        run: node_modules/.bin/gulp vscode-win32-x64 --max-old-space-size=8192

      - name: Zip Windows build
        run: |
          Compress-Archive -Path "..\VSCode-win32-x64\*" `
            -DestinationPath "sealpad-win32-x64.zip"

      - uses: actions/upload-artifact@v4
        with:
          name: sealpad-win32-x64
          path: sealpad-win32-x64.zip
          retention-days: 14

  # ──────────────────────────────────────────────
  # Auto-release on main push (arm64 Linux is best-effort)
  # ──────────────────────────────────────────────
  release:
    name: GitHub Release
    needs:
      - build-macos-arm64
      - build-macos-x64
      - build-linux-x64
      - build-windows-x64
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets/

      - name: Get version + tag
        id: version
        run: |
          VERSION=$(node -p "require('./package.json').version")
          SHORT_SHA="${GITHUB_SHA::7}"
          echo "tag=v${VERSION}-${SHORT_SHA}" >> $GITHUB_OUTPUT
          echo "name=Sealpad v${VERSION} (${SHORT_SHA})" >> $GITHUB_OUTPUT

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: ${{ steps.version.outputs.name }}
          draft: false
          prerelease: true
          generate_release_notes: false
          body: |
            ## Sealpad ${{ steps.version.outputs.tag }}

            Automated build from `main` — Phase 1 (fork, rebrand, auth skeleton).

            ### Downloads

            | Platform | File |
            |---|---|
            | macOS Apple Silicon (M1/M2/M3) | `sealpad-darwin-arm64.dmg` |
            | macOS Intel | `sealpad-darwin-x64.dmg` |
            | Linux x64 | `sealpad-linux-x64/` (.deb, .rpm, .tar.gz) |
            | Linux arm64 | `sealpad-linux-arm64/` (.deb, .tar.gz) |
            | Windows x64 | `sealpad-win32-x64.zip` |

            > ⚠️ Unsigned builds. macOS: right-click → Open to bypass Gatekeeper on first launch.

            ### Config

            Set Supabase credentials as `SEALPAD_SUPABASE_URL` and `SEALPAD_SUPABASE_ANON_KEY` in repo secrets before building.
          files: |
            release-assets/sealpad-darwin-arm64/*.dmg
            release-assets/sealpad-darwin-x64/*.dmg
            release-assets/sealpad-win32-x64/*.zip
            release-assets/sealpad-linux-x64/*
            release-assets/sealpad-linux-arm64/*
