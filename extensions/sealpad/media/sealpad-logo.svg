      <stop stop-color="#5E17EB"/>
      <stop offset="0.5" stop-color="#3A0CA3"/>
      <stop offset="1" stop-color="#00B4D8"/>
    </linearGradient>
    <linearGradient id="ring" x1="20" y1="20" x2="108" y2="108" gradientUnits="userSpaceOnUse">
