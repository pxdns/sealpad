  <circle cx="64" cy="64" r="44" fill="none" stroke="url(#ring)" stroke-width="2" opacity="0.4"/>
  <!-- Lock body -->
  <rect x="34" y="58" width="60" height="46" rx="10" fill="white" fill-opacity="0.95"/>
  <!-- Lock shackle -->
  <path d="M44 58V44C44 33.5 84 33.5 84 44V58" stroke="white" stroke-width="9" stroke-linecap="round" fill="none" stroke-opacity="0.95"/>
  <!-- Keyhole -->
  <circle cx="64" cy="79" r="7" fill="url(#bg)"/>
  <rect x="61" y="82" width="6" height="12" rx="3" fill="url(#bg)"/>
  <!-- Seal dots orbiting (Sealpad detail) -->
  <circle cx="64" cy="18" r="3.5" fill="white" fill-opacity="0.6"/>
  <circle cx="95" cy="27" r="2.5" fill="white" fill-opacity="0.4"/>
  <circle cx="110" cy="56" r="2" fill="white" fill-opacity="0.3"/>
  <defs>
